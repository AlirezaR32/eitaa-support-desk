# SPA + API reverse proxy (single-origin deployment).
# The API target is injected via env at runtime by docker-compose/k8s
# (nginx -g "daemon off;" with envsubst is an option; here we default to
# the compose service name `backend`).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # API -> backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        client_max_body_size 30m;
    }

    # Swagger docs passthrough (optional)
    location ~ ^/(docs|redoc|openapi.json|health|ready)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
